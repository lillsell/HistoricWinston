<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Historic Places in Winston-Salem</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">

<style>
html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }
.legend {
line-height: 40px;
font-size: 16px;
width: 190px;
color: #333333;
padding: 6px 8px;
background: white;
background: rgba(255,255,255,0.5);
box-shadow: 0 0 15px rgba(0,0,0,0.2);
border-radius: 5px;
}
.legend i {
width: 20px;
height: 20px;
float: left;
margin-right: 8px;
opacity: 0.9;
}
.legend img {
width: 16px;
height: 16px;
margin-right: 3px;
float: left;
}
.legend p {
font-size: 14px;
line-height: 20px;
margin: 0;
}

</style>

<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

</head>

<body>
<!-- Our web map and content will go here -->
<div id="map"></div>

<script>
    var mymap = L.map('map', {
        center: [36.098013, -80.241653],
        zoom: 11,
        maxZoom: 18,
        minZoom: 11,
        detectRetina: true
    });

    // Add basemap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
    }).addTo(mymap);

    // Add GeoJSON layer
    var CulturalResourceBuildingPoint_ExportFeatures = new L.GeoJSON.AJAX("assets/CulturalResourceBuildingPoint_ExportFeatures.geojson", {
        onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.property_t) {
                layer.bindPopup("<strong>" + feature.properties.property_t + "</strong>");
            }
        },
        pointToLayer: function (feature, latlng) {
    return L.marker(latlng, {
        icon: L.divIcon({
            html: '<i class="fa-solid fa-landmark marker-color-" style="color:#2c3e50; font-size:20px;"></i>',
            className: 'landmark', // Important: set this to '' or something minimal to avoid overriding the icon
            iconSize: [10, 10],
            popupAnchor: [0, -10]
        })
    });
}
});
    CulturalResourceBuildingPoint_ExportFeatures.addTo(mymap);

    // create the zoning district layer
    // 6. Set function for color ramp
colors = chroma.scale('Purples').colors(5); //we'll use 5 classes of purples
// this function manually defines your choropleth classification system
//so you'll need to figure out which break points you'd like to use
//based on the data distribution
//this equal interval classification with 5 classes, takes the range of the
//data (133) and divides it by 5, to show there are intervals of 27 per class
function setColor(density) {
    var id = 0;
    if (density > 10) {
        id = 4;
    } else if (density > 7) {
        id = 3;
    } else if (density > 4) {
        id = 2;
    } else if (density > 1) {
        id = 1;
    } else {
        id = 0;
    }
    return colors[id];
}

// 7. Set style function that sets fill color property equal to total Airbnbs
function style(feature) {
return {
fillColor: setColor(feature.properties.density),
fillOpacity: 1,
weight: 2,
opacity: 1,
color: '#b4b4b4',
dashArray: '4'
};
}

// 8. Add county polygons
L.geoJson.ajax("assets/winstonarea.geojson", {
style: style
}).addTo(mymap);

L.geoJson.ajax("assets/winstonarea.geojson").addTo(mymap);

// 9. Create Leaflet Control Object for Legend
var legend = L.control({position: 'topright'});
// 10. Function that runs when legend is added to map
legend.onAdd = function () {
// Create Div Element and Populate it with HTML
var div = L.DomUtil.create('div', 'legend');
//this line creates a title for the choropleth part of the legend
div.innerHTML += '<b>Historical Sites per area of Downtown</b><br />';
//notice the class breaks entered at the end of the next 5 lines
//the colors specify the shade of purple that we used to do the polygon shading
div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.5"></i><p>12+</p>';
div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.5"></i><p>9-11</p>';
div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.5"></i><p>6-8</p>';
div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.5"></i><p>3-5</p>';
div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.5"></i><p> 0-2</p>';
//this line provides the legend title for the airbnb colored symbols
div.innerHTML += '<hr><b>Hisotric Sites<b><br />';
//the next 3 lines call the airbnb icon along with its proper color
//notice the names of the Airbnb property types listed within the <p> tags at the end of the lines
div.innerHTML += '<i class="fa-solid fa-landmark marker-color-1"></i><p>historical site</p>';
// Return the Legend div containing the HTML content
return div;
};

// 11. Add a legend to map
legend.addTo(mymap);

// 12. Add a scale bar to map
L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>

</html>
